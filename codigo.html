<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Balance - Verificar teléfono</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <main class="app sin-nav">
      <div class="barra">
        <span>9:41</span>
        <span>● ● ●</span>
      </div>
      <div class="isla"></div>
      <a class="boton-icono" href="registro.html"> ‹ </a>
      <h1>Verificar tu teléfono</h1>
      <p>Ingresa el código que te llegó por SMS.</p>
      <form action="inicio.html">
        <div class="fila">
          <input
            class="campo"
            inputmode="numeric"
            maxlength="1"
            aria-label="Primer número"
          />
          <input
            class="campo"
            inputmode="numeric"
            maxlength="1"
            aria-label="Segundo número"
          />
          <input
            class="campo"
            inputmode="numeric"
            maxlength="1"
            aria-label="Tercer número"
          />
          <input
            class="campo"
            inputmode="numeric"
            maxlength="1"
            aria-label="Cuarto número"
          />
        </div>
        <a href="registro.html">Reenviar código</a>
        <button class="boton ancho" type="submit">Continuar</button>
      </form>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
